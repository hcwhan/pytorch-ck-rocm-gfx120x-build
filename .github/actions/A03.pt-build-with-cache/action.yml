name: PT build with ninja cache
description: Restore ninja cache, run a build CLI step, then save cache

inputs:
  pt-src:
    description: pytorch source root
    required: true
  cache-key:
    description: Primary cache key from 05.toolchain-fingerprint
    required: true
  use-cache:
    description: When true, restore build/ from cache when it exists; when false, lookup-only
    required: false
    default: "true"
  run:
    description: Shell script executed between cache restore and save
    required: true

outputs:
  cache-exists:
    description: Remote cache entry exists for cache-primary-key
    value: ${{ steps.pt-build-cache.outputs.cache-exists }}
  cache-used:
    description: Cache was restored into build/
    value: ${{ steps.pt-build-cache.outputs.cache-used }}

runs:
  using: composite
  steps:
    - name: Restore ninja incremental build cache
      id: pt-build-cache
      uses: "./.github/actions/A02.pt-ninja-cache-restore"
      with:
        pt-src: ${{ inputs.pt-src }}
        cache-key: ${{ inputs.cache-key }}
        use-cache: ${{ inputs.use-cache }}

    - name: Run build CLI step
      id: run-build
      shell: pwsh
      run: ${{ inputs.run }}

    - name: Delete stale ninja cache entry
      # Delete when cache-exists so save can refresh (actions/cache/save fails on an
      # existing key). use-cache=true: delete on success or failure (partial save).
      # use-cache=false: delete only on success (lookup-only cold build refresh path).
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && steps.pt-build-cache.outputs.cache-exists == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $key = [uri]::EscapeDataString('${{ steps.pt-build-cache.outputs.cache-primary-key }}')
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        gh api --method DELETE "/repos/${{ github.repository }}/actions/caches?key=$key&ref=$ref"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to delete stale ninja cache entry (key=$key, ref=$ref, exit=$LASTEXITCODE)"
          exit $LASTEXITCODE
        }

    - name: Save ninja incremental build cache
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success')
      uses: "./.github/actions/A04.pt-ninja-cache-save"
      with:
        pt-src: ${{ inputs.pt-src }}
        cache-primary-key: ${{ steps.pt-build-cache.outputs.cache-primary-key }}
