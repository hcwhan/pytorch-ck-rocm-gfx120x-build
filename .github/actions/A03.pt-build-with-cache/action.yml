name: PT build with worktree cache
description: 运行编译 CLI，并在结束后保存整棵 worktree 缓存

inputs:
  pt-src:
    description: PyTorch 源码根目录
    required: true
  cache-key:
    description: WORKTREE_CACHE_KEY
    required: true
  cache-exists:
    description: bootstrap restore 时远程 cache 是否存在
    required: false
    default: "false"
  use-cache:
    description: true 时在 compile 后 save worktree；false 时仅成功时 save
    required: false
    default: "true"
  run:
    description: 编译 shell 脚本
    required: true

runs:
  using: composite
  steps:
    - name: Run build CLI step
      id: run-build
      shell: pwsh
      run: ${{ inputs.run }}

    - name: Delete stale worktree cache entry
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && inputs.cache-exists == 'true' && inputs.cache-key != ''
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $key = [uri]::EscapeDataString('${{ inputs.cache-key }}')
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        gh api --method DELETE "/repos/${{ github.repository }}/actions/caches?key=$key&ref=$ref"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to delete stale worktree cache entry (key=$key, ref=$ref, exit=$LASTEXITCODE)"
          exit $LASTEXITCODE
        }

    - name: Save worktree cache
      id: save-worktree-cache
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && inputs.cache-key != ''
      uses: "./.github/actions/A06.worktree-cache-save"
      with:
        pt-src: ${{ inputs.pt-src }}
        cache-key: ${{ inputs.cache-key }}
