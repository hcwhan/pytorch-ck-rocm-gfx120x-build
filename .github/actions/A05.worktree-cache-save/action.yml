name: Save worktree cache
description: 保存 patch+hipify+build/ 整棵 PyTorch 工作树

inputs:
  pt-src:
    description: PyTorch 源码根目录
    required: true
  cache-key:
    description: WORKTREE_CACHE_KEY（与 A03 restore 相同）
    required: true

runs:
  using: composite
  steps:
    - name: Save worktree cache
      if: inputs.cache-key != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.pt-src }}
        key: ${{ inputs.cache-key }}
