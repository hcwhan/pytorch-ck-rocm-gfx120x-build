name: PT build with worktree cache
description: 运行编译 CLI，并在结束后保存 worktree + ccache（use_cache=true 时 compile 非 skipped 即 save；false 时仅成功 save）

inputs:
  pt-src:
    description: PyTorch 源码根目录
    required: true
  cache-key:
    description: WORKTREE_CACHE_KEY
    required: true
  cache-exists:
    description: bootstrap restore 时远程 worktree cache 是否存在
    required: false
    default: "false"
  ccache-cache-exists:
    description: bootstrap restore 时远程 ccache 是否存在
    required: false
    default: "false"
  use-cache:
    description: true 时在 build 后 save worktree + ccache（非 skipped 即 save）；false 时仅成功时 save
    required: false
    default: "true"
  run:
    description: 编译 CLI 命令（如 npx tsx scripts/cli.ts 08.build --pt-src …）
    required: true

runs:
  using: composite
  steps:
    - name: Run build CLI step
      id: run-build
      shell: pwsh
      run: ${{ inputs.run }}

    - name: Delete all stale worktree caches
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && inputs.cache-key != '' && env.ABORT_FORCE_KILLED != 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        $caches = gh api "/repos/${{ github.repository }}/actions/caches?ref=$ref" --paginate --jq '.actions_caches[] | {id, key}' | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "Failed to list worktree caches (ref=$ref, exit=$LASTEXITCODE); skipping delete"
          return
        }
        $deleted = 0
        foreach ($c in $caches) {
          if ($c.key -like "$env:WORKTREE_CACHE_PREFIX-*") {
            Write-Host "Deleting worktree cache: $($c.key)"
            gh api --method DELETE "/repos/${{ github.repository }}/actions/caches/$($c.id)" 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $deleted++ }
          }
        }
        Write-Host "Deleted $deleted stale worktree cache entries"

    - name: Save worktree cache
      id: save-worktree-cache
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && inputs.cache-key != '' && env.ABORT_FORCE_KILLED != 'true'
      uses: "./.github/actions/A05.worktree-cache-save"
      with:
        pt-src: ${{ inputs.pt-src }}
        cache-key: ${{ inputs.cache-key }}

    - name: Delete all stale ccache entries
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && env.CCACHE_CACHE_KEY != '' && env.ABORT_FORCE_KILLED != 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        $caches = gh api "/repos/${{ github.repository }}/actions/caches?ref=$ref" --paginate --jq '.actions_caches[] | {id, key}' | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "Failed to list ccache entries (ref=$ref, exit=$LASTEXITCODE); skipping delete"
          return
        }
        $deleted = 0
        foreach ($c in $caches) {
          if ($c.key -like "$env:CCACHE_CACHE_PREFIX-*") {
            Write-Host "Deleting ccache entry: $($c.key)"
            gh api --method DELETE "/repos/${{ github.repository }}/actions/caches/$($c.id)" 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $deleted++ }
          }
        }
        Write-Host "Deleted $deleted stale ccache entries"

    - name: Save ccache
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && env.CCACHE_CACHE_KEY != '' && env.ABORT_FORCE_KILLED != 'true'
      uses: "./.github/actions/A06.ccache-save"
