name: Restore ccache
description: 恢复 GHA ccache 目录（CCACHE_CACHE_KEY 槽位最新 versioned key）

outputs:
  cache-exists:
    description: CCACHE_CACHE_KEY 对应的远程缓存条目是否存在（'true' / 'false'）
    value: ${{ steps.ccache-cache.outputs.cache-exists }}

runs:
  using: composite
  steps:
    - name: Restore ccache
      uses: hcwhan/actions/kit/cache/restore@main
      id: ccache-restore
      with:
        path: ${{ runner.temp }}/ccache
        family-key: ${{ env.CCACHE_CACHE_PREFIX }}
        cache-key: ${{ env.CCACHE_CACHE_KEY }}

    - name: Resolve ccache cache outputs
      id: ccache-cache
      shell: pwsh
      run: |
        $exists = '${{ steps.ccache-restore.outputs.cache-exists }}' -eq 'true'
        $used = '${{ steps.ccache-restore.outputs.cache-used }}' -eq 'true'
        Write-Host "ccache restore: exists=$exists used=$used key=$env:CCACHE_CACHE_KEY dir=$env:CCACHE_DIR"
        $existsStr = if ($exists) { 'true' } else { 'false' }
        "cache-exists=$existsStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
