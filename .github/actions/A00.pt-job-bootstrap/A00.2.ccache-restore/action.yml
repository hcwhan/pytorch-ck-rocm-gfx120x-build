name: Restore ccache
description: 恢复 GHA ccache 目录（CCACHE_CACHE_KEY 精确匹配）

outputs:
  cache-exists:
    description: CCACHE_CACHE_KEY 对应的远程缓存条目是否存在（'true' / 'false'）
    value: ${{ steps.ccache-cache.outputs.cache-exists }}

runs:
  using: composite
  steps:
    - name: Restore ccache
      uses: actions/cache/restore@v6
      id: ccache-restore
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ env.CCACHE_CACHE_KEY }}

    - name: Resolve ccache cache outputs
      id: ccache-cache
      shell: pwsh
      run: |
        $exists = '${{ steps.ccache-restore.outputs.cache-hit }}' -eq 'true'
        Write-Host "ccache restore: exists=$exists key=$env:CCACHE_CACHE_KEY dir=$env:CCACHE_DIR"
        $existsStr = if ($exists) { 'true' } else { 'false' }
        "cache-exists=$existsStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
