name: Restore worktree cache
description: 恢复 patch+hipify+build/ 整棵 PyTorch 工作树（WORKTREE_CACHE_KEY 槽位最新 versioned key；use-cache=false 时仅 lookup）

inputs:
  pt-src:
    description: PyTorch 源码根目录
    required: true
  use-cache:
    description: true 时 restore worktree；false 时仅 lookup
    required: false
    default: "true"

outputs:
  cache-exists:
    description: WORKTREE_CACHE_KEY 对应的远程缓存条目是否存在
    value: ${{ steps.worktree-cache.outputs.cache-exists }}
  cache-used:
    description: 已将缓存 restore 到 pt-src
    value: ${{ steps.worktree-cache.outputs.cache-used }}

runs:
  using: composite
  steps:
    - name: Restore worktree cache
      if: inputs.use-cache == 'true'
      uses: hcwhan/actions/cache/restore@v1
      id: cache-restore
      with:
        path: ${{ inputs.pt-src }}
        family-key: ${{ env.WORKTREE_CACHE_PREFIX }}
        cache-key: ${{ env.WORKTREE_CACHE_KEY }}

    - name: Lookup worktree cache (restore skipped)
      if: inputs.use-cache != 'true'
      uses: hcwhan/actions/cache/lookup@v1
      id: cache-lookup
      with:
        cache-key: ${{ env.WORKTREE_CACHE_KEY }}

    - name: Resolve worktree cache outputs
      id: worktree-cache
      shell: pwsh
      run: |
        if ('${{ inputs.use-cache }}' -eq 'true') {
          $exists = '${{ steps.cache-restore.outputs.cache-exists }}' -eq 'true'
          $used = '${{ steps.cache-restore.outputs.cache-used }}' -eq 'true'
        } else {
          $exists = '${{ steps.cache-lookup.outputs.cache-exists }}' -eq 'true'
          $used = $false
        }
        Write-Host "Worktree cache restore: exists=$exists used=$used key=$env:WORKTREE_CACHE_KEY"
        $existsStr = if ($exists) { 'true' } else { 'false' }
        $usedStr = if ($used) { 'true' } else { 'false' }
        "cache-exists=$existsStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "cache-used=$usedStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
