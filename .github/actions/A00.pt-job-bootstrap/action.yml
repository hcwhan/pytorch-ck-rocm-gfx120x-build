name: PT job bootstrap
description: Node/npm、01.config、toolchain、worktree cache、条件 prep/patch/hipify（使用前需 job 级 actions/checkout）

outputs:
  worktree-cache-exists:
    description: worktree cache 远程条目是否存在
    value: ${{ steps.worktree-cache.outputs.cache-exists }}
  worktree-cache-used:
    description: 已 restore worktree cache
    value: ${{ steps.worktree-cache.outputs.cache-used }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - name: Install npm dependencies
      shell: pwsh
      run: npm ci

    - name: Load VERSION.lock.json
      shell: pwsh
      run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

    - name: Setup ROCm toolchain
      uses: "./.github/actions/A01.pt-rocm-toolchain"
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        rocm-index: ${{ env.ROCM_INDEX }}
        rocm-version: ${{ env.ROCM_VERSION }}
        pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

    - name: Fingerprint worktree cache key
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --export-github-env
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore ccache
      uses: "./.github/actions/A02.ccache-restore"

    - name: Restore worktree cache
      id: worktree-cache
      uses: "./.github/actions/A03.worktree-cache-restore"
      with:
        pt-src: ${{ env.PT_SRC }}
        use-cache: ${{ env.USE_CACHE }}

    - name: Verify restored worktree
      if: steps.worktree-cache.outputs.cache-used == 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 03.worktree-stamp --pt-src $env:PT_SRC -w $env:GITHUB_WORKSPACE --verify
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Clone pytorch source
      if: steps.worktree-cache.outputs.cache-used != 'true'
      shell: pwsh
      run: |
        git config --global core.longpaths true
        npx tsx scripts/cli.ts 03.prep --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Patch and hipify pytorch source
      if: steps.worktree-cache.outputs.cache-used != 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 04.patch --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npx tsx scripts/cli.ts 04.hipify --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npx tsx scripts/cli.ts 03.worktree-stamp --pt-src $env:PT_SRC -w $env:GITHUB_WORKSPACE --write
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Export worktree cache used env
      shell: pwsh
      run: |
        "WORKTREE_CACHE_USED=${{ steps.worktree-cache.outputs.cache-used }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
