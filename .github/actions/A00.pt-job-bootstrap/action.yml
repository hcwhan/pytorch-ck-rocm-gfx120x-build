name: PT job bootstrap
description: Node/npm, 01.config, optional prep/patch, and toolchain (requires job-level actions/checkout before use)

inputs:
  prep-source:
    description: Run 03.prep and 04.patch (requires PT_SRC job env)
    required: false
    default: "true"
  setup-toolchain:
    description: Run A01.pt-rocm-toolchain (reads PYTHON_* / ROCM_* / PIP_TOOLCHAIN_CACHE_KEY from 01.config)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - name: Install npm dependencies
      shell: pwsh
      run: npm ci

    - name: Load VERSION.lock.json
      shell: pwsh
      run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

    - name: Clone and patch pytorch source
      if: inputs.prep-source == 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 03.prep --pt-src $env:PT_SRC
        npx tsx scripts/cli.ts 04.patch --pt-src $env:PT_SRC

    - name: Setup ROCm toolchain
      if: inputs.setup-toolchain == 'true'
      uses: "./.github/actions/A01.pt-rocm-toolchain"
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        rocm-index: ${{ env.ROCM_INDEX }}
        rocm-version: ${{ env.ROCM_VERSION }}
        pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}
