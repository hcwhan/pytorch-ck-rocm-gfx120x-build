name: PT job bootstrap
description: Node/npm、01.config、可选 prep/patch 与工具链（使用前需 job 级 actions/checkout）

inputs:
  prep-source:
    description: 运行 03.prep 与 04.patch（需 PT_SRC job env）
    required: false
    default: "true"
  setup-toolchain:
    description: 运行 A01.pt-rocm-toolchain（从 01.config 读取 PYTHON_* / ROCM_* / PIP_TOOLCHAIN_CACHE_KEY）
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - name: Install npm dependencies
      shell: pwsh
      run: npm ci

    - name: Load VERSION.lock.json
      shell: pwsh
      run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

    - name: Restore PT source cache
      if: inputs.prep-source == 'true'
      id: pt-src-cache
      uses: "./.github/actions/A05.pt-src-cache-restore"
      with:
        pt-src: ${{ env.PT_SRC }}

    - name: Clone, patch, and hipify pytorch source
      if: inputs.prep-source == 'true'
      id: prep-source
      shell: pwsh
      run: |
        git config --global core.longpaths true
        npx tsx scripts/cli.ts 03.prep --pt-src $env:PT_SRC --use-cache
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npx tsx scripts/cli.ts 04.patch --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npx tsx scripts/cli.ts 04.hipify --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Save PT source cache
      if: inputs.prep-source == 'true' && steps.prep-source.outputs.cloned == 'true'
      uses: "./.github/actions/A06.pt-src-cache-save"
      with:
        pt-src: ${{ env.PT_SRC }}
        cache-key: ${{ env.PT_SRC_CACHE_KEY }}

    - name: Setup ROCm toolchain
      if: inputs.setup-toolchain == 'true'
      uses: "./.github/actions/A01.pt-rocm-toolchain"
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        rocm-index: ${{ env.ROCM_INDEX }}
        rocm-version: ${{ env.ROCM_VERSION }}
        pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}
