name: PT job bootstrap
description: Node/npm、01.config、toolchain、worktree cache、条件 prep/patch/hipify（使用前需 job 级 actions/checkout）

outputs:
  worktree-cache-exists:
    description: worktree cache 远程条目是否存在
    value: ${{ steps.worktree-cache.outputs.cache-exists }}
  worktree-cache-used:
    description: 已 restore 且 bootstrap 校验通过（跳过 prep/patch/hipify）
    value: ${{ steps.export-worktree-used.outputs.cache-used }}
  ccache-cache-exists:
    description: ccache 远程条目是否存在
    value: ${{ steps.ccache-cache.outputs.cache-exists }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - name: Install npm dependencies
      shell: pwsh
      run: npm ci

    - name: Load VERSION.lock.json
      shell: pwsh
      run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

    - name: Setup ROCm toolchain
      uses: "./.github/actions/A01.pt-rocm-toolchain"
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        rocm-index: ${{ env.ROCM_INDEX }}
        rocm-version: ${{ env.ROCM_VERSION }}
        pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

    - name: Fingerprint worktree cache key
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 02.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --export-github-env
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore ccache
      id: ccache-cache
      uses: "./.github/actions/A02.ccache-restore"

    - name: Restore worktree cache
      id: worktree-cache
      uses: "./.github/actions/A03.worktree-cache-restore"
      with:
        pt-src: ${{ env.PT_SRC }}
        use-cache: ${{ env.USE_CACHE }}

    - name: Verify restored worktree bootstrap
      if: steps.worktree-cache.outputs.cache-used == 'true'
      id: worktree-bootstrap-verify
      continue-on-error: true
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 06.verify-bootstrap --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Resolve worktree cache used
      id: export-worktree-used
      shell: pwsh
      run: |
        $hit = '${{ steps.worktree-cache.outputs.cache-used }}' -eq 'true'
        $verified = '${{ steps.worktree-bootstrap-verify.outcome }}' -eq 'success'
        $used = if ($hit -and $verified) { 'true' } else { 'false' }
        Write-Host "Worktree cache used: hit=$hit verified=$verified -> $used"
        "cache-used=$used" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "WORKTREE_CACHE_USED=$used" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Clone pytorch source
      if: steps.export-worktree-used.outputs.cache-used != 'true'
      shell: pwsh
      run: |
        git config --global core.longpaths true
        npx tsx scripts/cli.ts 03.prep --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Patch and hipify pytorch source
      if: steps.export-worktree-used.outputs.cache-used != 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 04.patch --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npx tsx scripts/cli.ts 05.hipify --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
