name: PT post-build cache save
description: compile 后保存 worktree + ccache（清理与 verify 由 hcwhan/actions/kit/cache 默认 cleanup-stale 处理；由调用方 gate 执行条件）

inputs:
  pt-src:
    description: PyTorch 源码根目录
    required: true

runs:
  using: composite
  steps:
    - name: Save worktree cache
      uses: hcwhan/actions/kit/cache/save@main
      with:
        path: ${{ inputs.pt-src }}
        family-key: ${{ env.WORKTREE_CACHE_PREFIX }}
        cache-key: ${{ env.WORKTREE_CACHE_KEY }}

    - name: Save ccache
      uses: hcwhan/actions/kit/cache/save@main
      with:
        path: ${{ runner.temp }}/ccache
        family-key: ${{ env.CCACHE_CACHE_PREFIX }}
        cache-key: ${{ env.CCACHE_CACHE_KEY }}
