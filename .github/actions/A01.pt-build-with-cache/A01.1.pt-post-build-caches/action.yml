name: PT post-build cache save
description: compile 后统一执行 worktree/ccache 清理、保存与传播等待（由调用方 gate 执行条件）

inputs:
  pt-src:
    description: PyTorch 源码根目录
    required: true

runs:
  using: composite
  steps:
    - name: Delete all stale worktree caches
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        $caches = gh api "/repos/${{ github.repository }}/actions/caches?ref=$ref" --paginate --jq '.actions_caches[] | {id, key}' | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "Failed to list worktree caches (ref=$ref, exit=$LASTEXITCODE); skipping delete"
          return
        }
        $deleted = 0
        foreach ($c in $caches) {
          if ($c.key -like "$env:WORKTREE_CACHE_PREFIX-*") {
            Write-Host "Deleting worktree cache: $($c.key)"
            gh api --method DELETE "/repos/${{ github.repository }}/actions/caches/$($c.id)" 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $deleted++ }
          }
        }
        Write-Host "Deleted $deleted stale worktree cache entries"

    - name: Save worktree cache
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.pt-src }}
        key: ${{ env.WORKTREE_CACHE_KEY }}

    - name: Delete all stale ccache entries
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        $caches = gh api "/repos/${{ github.repository }}/actions/caches?ref=$ref" --paginate --jq '.actions_caches[] | {id, key}' | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "Failed to list ccache entries (ref=$ref, exit=$LASTEXITCODE); skipping delete"
          return
        }
        $deleted = 0
        foreach ($c in $caches) {
          if ($c.key -like "$env:CCACHE_CACHE_PREFIX-*") {
            Write-Host "Deleting ccache entry: $($c.key)"
            gh api --method DELETE "/repos/${{ github.repository }}/actions/caches/$($c.id)" 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $deleted++ }
          }
        }
        Write-Host "Deleted $deleted stale ccache entries"

    - name: Save ccache
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ env.CCACHE_CACHE_KEY }}

    - name: Wait for GitHub Actions cache propagation
      shell: pwsh
      run: |
        Write-Host "Waiting 180s after worktree + ccache save for GitHub cache API propagation..."
        Start-Sleep -Seconds 180
