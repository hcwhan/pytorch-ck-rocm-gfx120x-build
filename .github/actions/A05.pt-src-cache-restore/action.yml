name: Restore PT source cache
description: 恢复 PyTorch prep 源码树（精确 PT_SRC_CACHE_KEY；无 restore-keys）

inputs:
  pt-src:
    description: PyTorch 源码根目录
    required: true

outputs:
  cache-exists:
    description: PT_SRC_CACHE_KEY 对应的远程缓存条目是否存在
    value: ${{ steps.pt-src-cache.outputs.cache-exists }}
  cache-used:
    description: 已将缓存 restore 到 pt-src
    value: ${{ steps.pt-src-cache.outputs.cache-used }}
  cache-primary-key:
    description: 解析后的主 cache key
    value: ${{ steps.pt-src-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Restore PT source cache
      uses: actions/cache/restore@v6
      id: cache-restore
      with:
        path: ${{ inputs.pt-src }}
        key: ${{ env.PT_SRC_CACHE_KEY }}

    - name: Resolve PT source cache outputs
      id: pt-src-cache
      shell: pwsh
      run: |
        $exists = '${{ steps.cache-restore.outputs.cache-hit }}' -eq 'true'
        Write-Host "PT source cache restore: exists=$exists used=$exists key=$env:PT_SRC_CACHE_KEY"
        "cache-primary-key=$env:PT_SRC_CACHE_KEY" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "cache-exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "cache-used=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
