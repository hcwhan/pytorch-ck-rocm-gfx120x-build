name: Restore PT ninja build cache
description: Restore pytorch build/ incremental cache (exact cache-key match only; no restore-keys fallback)

inputs:
  pt-src:
    description: pytorch source root
    required: true
  cache-key:
    description: Primary cache key from 05.toolchain-fingerprint
    required: true
  skip-cache:
    description: When true, skip cache restore (cache-primary-key still resolved; save skipped by A03)
    required: false
    default: "false"

outputs:
  cache-hit:
    description: Exact cache key match
    value: ${{ steps.pt-build-cache.outputs.cache-hit }}
  cache-primary-key:
    description: Resolved primary cache key
    value: ${{ steps.pt-build-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Restore ninja incremental build cache
      if: inputs.skip-cache != 'true'
      uses: actions/cache/restore@v6
      id: cache-restore
      with:
        path: ${{ inputs.pt-src }}\build
        key: ${{ inputs.cache-key }}

    - name: Resolve cache restore outputs
      id: pt-build-cache
      shell: pwsh
      run: |
        if ('${{ inputs.skip-cache }}' -eq 'true') {
          Write-Host "Cache disabled by workflow input; skipping restore"
          "cache-primary-key=${{ inputs.cache-key }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache-hit=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          "cache-primary-key=${{ steps.cache-restore.outputs.cache-primary-key }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache-hit=${{ steps.cache-restore.outputs.cache-hit }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }
