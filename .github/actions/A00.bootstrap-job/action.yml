name: Bootstrap job
description: Node 26/npm、01.config、00.install-windows-deps、02.toolchain-fingerprint、ccache/worktree cache restore、06.verify-bootstrap、条件 prep/patch/hipify、07.pin-mtimes（需 job 级 actions/checkout 与 env PT_SRC/USE_CACHE）

outputs:
  worktree-cache-exists:
    description: worktree cache 远程条目是否存在
    value: ${{ steps.worktree-cache.outputs.cache-exists }}
  worktree-cache-used:
    description: worktree cache restore 命中（used 时须通过 06.verify-bootstrap，失败则 bootstrap 终止；跳过 prep/patch/hipify）
    value: ${{ steps.worktree-cache.outputs.cache-used }}
  ccache-cache-exists:
    description: ccache cache 远程条目是否存在
    value: ${{ steps.ccache-cache.outputs.cache-exists }}
  ccache-cache-used:
    description: ccache cache restore 命中
    value: ${{ steps.ccache-cache.outputs.cache-used }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - name: Run npm ci
      shell: pwsh
      run: npm ci

    - name: Export VERSION.lock env
      shell: pwsh
      run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
      with:
        arch: x64

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Restore pip toolchain cache
      uses: hcwhan/actions/kit/cache/restore@main
      id: pip-toolchain-cache
      with:
        path: ${{ runner.temp }}/pip-toolchain-cache
        family-key: ${{ env.PIP_TOOLCHAIN_CACHE_PREFIX }}
        cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

    - name: Export pip cache dir env
      shell: pwsh
      run: echo "PIP_CACHE_DIR=$env:RUNNER_TEMP/pip-toolchain-cache" >> $env:GITHUB_ENV

    - name: Upgrade pip tooling
      shell: pwsh
      run: |
        python -m pip install --upgrade pip wheel setuptools psutil packaging ninja cmake

    - name: Install ROCm devel SDK
      shell: pwsh
      run: |
        python -m pip install `
          --index-url ${{ env.ROCM_INDEX }} `
          "rocm[devel]==${{ env.ROCM_VERSION }}"

    - name: Install ROCm runtime libraries and device wheels
      shell: pwsh
      run: |
        if (-not $env:GPU_ARCHS) {
          throw "GPU_ARCHS is not set (run 01.config --export-github-env first)"
        }
        $devicePackages = @()
        foreach ($arch in ($env:GPU_ARCHS -split ';')) {
          $trimmed = $arch.Trim()
          if ($trimmed) {
            $devicePackages += "rocm-sdk-device-$trimmed==${{ env.ROCM_VERSION }}"
          }
        }
        if ($devicePackages.Count -lt 1) {
          throw "GPU_ARCHS is empty: '$env:GPU_ARCHS'"
        }
        python -m pip install `
          --index-url ${{ env.ROCM_INDEX }} `
          "rocm-sdk-libraries==${{ env.ROCM_VERSION }}" `
          @devicePackages

    - name: Initialize ROCm devel tree
      shell: pwsh
      run: |
        python -m rocm_sdk init --quiet
        $develRoot = python -m rocm_sdk path --root
        Write-Host "ROCm devel root: $develRoot"
        $rocrand = Join-Path $develRoot 'bin/rocrand.dll'
        if (-not (Test-Path $rocrand)) {
          throw "rocrand.dll missing after rocm_sdk init: $rocrand"
        }
        Write-Host "OK rocrand.dll present at $rocrand"

    - name: Save pip toolchain cache
      if: steps.pip-toolchain-cache.outputs.cache-used != 'true'
      uses: hcwhan/actions/kit/cache/save@main
      with:
        path: ${{ runner.temp }}/pip-toolchain-cache
        family-key: ${{ env.PIP_TOOLCHAIN_CACHE_PREFIX }}
        cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

    - name: Install ccache and libuv
      shell: pwsh
      run: npx tsx scripts/cli.ts 00.install-windows-deps

    - name: Fingerprint worktree + ccache cache keys
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 02.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --export-github-env
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore or Lookup ccache cache
      uses: hcwhan/actions/kit/cache/restore@main
      id: ccache-cache
      with:
        path: ${{ runner.temp }}/ccache
        family-key: ${{ env.CCACHE_CACHE_PREFIX }}
        cache-key: ${{ env.CCACHE_CACHE_KEY }}
        only-lookup: ${{ env.USE_CACHE == 'true' && 'false' || 'true' }}

    - name: Restore or Lookup worktree cache
      uses: hcwhan/actions/kit/cache/restore@main
      id: worktree-cache
      with:
        path: ${{ env.PT_SRC }}
        family-key: ${{ env.WORKTREE_CACHE_PREFIX }}
        cache-key: ${{ env.WORKTREE_CACHE_KEY }}
        only-lookup: ${{ env.USE_CACHE == 'true' && 'false' || 'true' }}

    - name: Verify restored worktree
      if: steps.worktree-cache.outputs.cache-used == 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 06.verify-bootstrap --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Prepare PyTorch source
      if: steps.worktree-cache.outputs.cache-used != 'true'
      shell: pwsh
      run: |
        git config --global core.longpaths true
        npx tsx scripts/cli.ts 03.prep --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Patch and hipify PyTorch source
      if: steps.worktree-cache.outputs.cache-used != 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 04.patch --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npx tsx scripts/cli.ts 05.hipify --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Pin worktree mtimes
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 07.pin-mtimes --pt-src $env:PT_SRC
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
