name: PT ROCm toolchain
description: PyTorch 源码构建用 Python、MSVC、rocm[devel]、ccache、pip toolchain cache、rocm-sdk-libraries/device wheels、ninja/cmake（不安装预编译 torch；需 env GPU_ARCHS；为 02.toolchain-fingerprint 提供工具链环境）

inputs:
  python-version:
    description: Python 版本（VERSION.lock.json toolchain.python）
    required: true
  rocm-index:
    description: ROCm wheel 的 pip index URL（VERSION.lock.json toolchain.rocm_index）
    required: true
  rocm-version:
    description: ROCm pip 包版本（rocm[devel]、rocm-sdk-libraries、rocm-sdk-device-*；VERSION.lock.json toolchain.rocm）
    required: true
  pip-cache-key:
    description: Pip 工具链缓存 key（VERSION.lock.json → PIP_TOOLCHAIN_CACHE_KEY）
    required: true

runs:
  using: composite
  steps:
    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
      with:
        arch: x64

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ccache
      shell: pwsh
      run: |
        $ccacheVersion = "4.13.6"
        $installed = $false

        for ($attempt = 1; $attempt -le 3; $attempt++) {
          choco install ccache --version=$ccacheVersion --no-progress -y
          if ($LASTEXITCODE -eq 0) {
            $installed = $true
            break
          }
          Write-Host "choco ccache attempt $attempt failed (exit=$LASTEXITCODE), retrying..."
          Start-Sleep -Seconds 15
        }

        if (-not $installed) {
          Write-Host "choco unavailable; installing ccache v$ccacheVersion from GitHub release"
          $installRoot = Join-Path $env:RUNNER_TEMP "ccache-bin"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $zipUrl = "https://github.com/ccache/ccache/releases/download/v$ccacheVersion/ccache-$ccacheVersion-windows-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "ccache-$ccacheVersion-windows-x86_64.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $installRoot -Force
          $ccacheExe = Get-ChildItem -Path $installRoot -Recurse -Filter "ccache.exe" | Select-Object -First 1
          if (-not $ccacheExe) {
            throw "ccache.exe not found under $installRoot after GitHub release extract"
          }
          $ccacheDir = $ccacheExe.DirectoryName
          $env:Path = "$ccacheDir;$env:Path"
          "$ccacheDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        } else {
          $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath"
        }

        ccache --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Export ccache directory
      shell: pwsh
      run: |
        "CCACHE_DIR=$env:RUNNER_TEMP/ccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "CCACHE_COMPRESS=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Restore pip toolchain cache
      uses: actions/cache/restore@v6
      id: pip-toolchain-cache
      with:
        path: ${{ runner.temp }}/pip-toolchain-cache
        key: ${{ inputs.pip-cache-key }}

    - name: Export pip cache directory
      shell: pwsh
      run: echo "PIP_CACHE_DIR=$env:RUNNER_TEMP/pip-toolchain-cache" >> $env:GITHUB_ENV

    - name: Upgrade pip tooling
      shell: pwsh
      run: |
        python -m pip install --upgrade pip wheel setuptools psutil packaging ninja cmake

    - name: Install rocm[devel] SDK
      shell: pwsh
      run: |
        python -m pip install `
          --index-url ${{ inputs.rocm-index }} `
          "rocm[devel]==${{ inputs.rocm-version }}"

    - name: Install ROCm runtime libraries and device wheels
      shell: pwsh
      run: |
        if (-not $env:GPU_ARCHS) {
          throw "GPU_ARCHS is not set (run 01.config --export-github-env first)"
        }
        $devicePackages = @()
        foreach ($arch in ($env:GPU_ARCHS -split ';')) {
          $trimmed = $arch.Trim()
          if ($trimmed) {
            $devicePackages += "rocm-sdk-device-$trimmed==${{ inputs.rocm-version }}"
          }
        }
        if ($devicePackages.Count -lt 1) {
          throw "GPU_ARCHS is empty: '$env:GPU_ARCHS'"
        }
        python -m pip install `
          --index-url ${{ inputs.rocm-index }} `
          "rocm-sdk-libraries==${{ inputs.rocm-version }}" `
          @devicePackages

    - name: Initialize ROCm devel tree
      shell: pwsh
      run: |
        python -m rocm_sdk init --quiet
        $develRoot = python -m rocm_sdk path --root
        Write-Host "ROCm devel root: $develRoot"
        $rocrand = Join-Path $develRoot 'bin/rocrand.dll'
        if (-not (Test-Path $rocrand)) {
          throw "rocrand.dll missing after rocm_sdk init: $rocrand"
        }
        Write-Host "OK rocrand.dll present at $rocrand"

    - name: Save pip toolchain cache
      if: steps.pip-toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/pip-toolchain-cache
        key: ${{ inputs.pip-cache-key }}
