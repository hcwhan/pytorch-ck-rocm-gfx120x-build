name: Build PyTorch CK SDPA serial (Windows gfx120x)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja 并行编译 worker 数（OOM 时可改为 2）"
        required: false
        default: "4"
      use_cache:
        description: "存在匹配条目时 restore worktree（含 build/）；false 时 miss 路径仍 save"
        type: boolean
        required: false
        default: true
      publish_release:
        description: "构建成功后上传 wheel 到 GitHub Releases"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-torch-ck-gfx120x-serial
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  PT_SRC: C:\pt\pytorch
  USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}

jobs:
  compile-and-wheel:
    name: compile-and-wheel
    runs-on: windows-2022

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        id: bootstrap
        uses: "./.github/actions/A00.pt-job-bootstrap"

      - name: Compile PyTorch with worktree cache
        uses: "./.github/actions/A04.pt-build-with-cache"
        with:
          pt-src: ${{ env.PT_SRC }}
          cache-key: ${{ env.WORKTREE_CACHE_KEY }}
          cache-exists: ${{ steps.bootstrap.outputs.worktree-cache-exists }}
          use-cache: ${{ env.USE_CACHE }}
          run: npx tsx scripts/cli.ts 07.build --pt-src $env:PT_SRC

      - name: Write compile cache metadata
        shell: pwsh
        run: |
          $entry = [ordered]@{
            opt_dim = $env:CK_OPT_DIM
            key = $env:WORKTREE_CACHE_KEY
            exists = '${{ steps.bootstrap.outputs.worktree-cache-exists }}' -eq 'true'
            used = '${{ steps.bootstrap.outputs.worktree-cache-used }}' -eq 'true'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $entry | ConvertTo-Json -Depth 3 -AsArray | Out-File -FilePath dist/build-caches.json -Encoding utf8

      - name: Package torch wheel
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --pt-src $env:PT_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Verify wheel and publish
        uses: "./.github/actions/A99.pt-verify-publish"
        with:
          build-caches: dist/build-caches.json
