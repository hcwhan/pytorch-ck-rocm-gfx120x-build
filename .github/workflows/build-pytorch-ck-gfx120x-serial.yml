name: Build PyTorch CK SDPA serial (Windows gfx120x)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers (use 2 if OOM)"
        required: false
        default: "4"
      use_cache:
        description: "Restore ninja cache into build/ when a matching entry exists (lookup-only when false)"
        type: boolean
        required: false
        default: true
      publish_release:
        description: "Upload wheel to GitHub Releases after successful build"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-torch-ck-gfx120x-serial
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  PT_SRC: C:\pt\pytorch
  USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}

jobs:
  compile-and-wheel:
    name: compile-and-wheel
    runs-on: windows-2022

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.pt-job-bootstrap"

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE

      - name: Compile PyTorch with ninja cache
        id: compile
        uses: "./.github/actions/A03.pt-build-with-cache"
        with:
          pt-src: ${{ env.PT_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          use-cache: ${{ env.USE_CACHE }}
          run: npx tsx scripts/cli.ts 06.build --pt-src $env:PT_SRC

      - name: Write compile cache metadata
        shell: pwsh
        run: |
          $entry = [ordered]@{
            opt_dim = $env:CK_OPT_DIM
            key = '${{ steps.toolchain-fingerprint.outputs.cache-key }}'
            exists = '${{ steps.compile.outputs.cache-exists }}' -eq 'true'
            used = '${{ steps.compile.outputs.cache-used }}' -eq 'true'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $entry | ConvertTo-Json -Depth 3 -AsArray | Out-File -FilePath dist/build-caches.json -Encoding utf8

      - name: Package torch wheel
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --pt-src $env:PT_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Verify wheel and publish
        uses: "./.github/actions/A99.pt-verify-publish"
        with:
          build-caches: dist/build-caches.json
