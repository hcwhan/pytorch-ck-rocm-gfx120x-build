name: Build PyTorch CK SDPA serial (Windows gfx120x)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja 并行编译 worker 数（OOM 时可改为 2）"
        type: string
        required: false
        default: "4"
      use_cache:
        description: "true：restore worktree（含 build/）；compile 非 skipped 即 save worktree+ccache（含失败/看门狗；force-killed 除外）。false：不 restore（restore only-lookup 探测 exists；used=false）；仅 compile 成功时 save；ccache 同规则"
        type: boolean
        required: false
        default: true
      publish_release:
        description: "构建成功后上传 wheel 到 GitHub Releases"
        type: boolean
        required: false
        default: true
      retry_count:
        description: "看门狗 retry 计数（≥8 不再自动触发）"
        type: string
        required: false
        default: "0"

concurrency:
  group: build-torch-ck-gfx120x-serial
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  PT_SRC: C:\pt\pytorch
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}
  PUBLISH_RELEASE: ${{ github.event.inputs.publish_release != 'false' && 'true' || 'false' }}
  RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}

jobs:
  compile-and-wheel:
    name: compile-and-wheel
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Record job start
        id: job-start
        uses: hcwhan/actions/kit/watchdog/job-start@main

      - name: Bootstrap job
        id: bootstrap
        uses: "./.github/actions/A00.bootstrap-job"

      - name: Compile PyTorch and save cache
        id: build
        uses: "./.github/actions/A01.compile-with-cache"
        with:
          job-start-time: ${{ steps.job-start.outputs.job-start-time }}
          pt-src: ${{ env.PT_SRC }}
          use-cache: ${{ env.USE_CACHE }}
          worktree-cache-used: ${{ steps.bootstrap.outputs.worktree-cache-used }}

      - name: Retry after watchdog abort
        if: always() && !cancelled() && steps.build.outputs.should-retry == 'true'
        uses: hcwhan/actions/kit/watchdog/dispatch-retry@main
        with:
          should-retry: ${{ steps.build.outputs.should-retry }}
          use-cache: ${{ env.USE_CACHE }}
          retry-count: ${{ env.RETRY_COUNT }}
          workflow-file: build-pytorch-ck-gfx120x-serial.yml
          dispatch-inputs: |
            {"ninja_workers":"${{ env.MAX_JOBS }}","use_cache":"${{ env.USE_CACHE }}","publish_release":"${{ env.PUBLISH_RELEASE }}"}

      - name: Write compile success metadata
        if: success()
        shell: pwsh
        run: |
          $entry = [ordered]@{
            opt_dim = $env:CK_OPT_DIM
            'worktree-cache-key' = $env:WORKTREE_CACHE_KEY
            'worktree-cache-exists' = '${{ steps.bootstrap.outputs.worktree-cache-exists }}' -eq 'true'
            'worktree-cache-used' = '${{ steps.bootstrap.outputs.worktree-cache-used }}' -eq 'true'
            'ccache-cache-key' = $env:CCACHE_CACHE_KEY
            'ccache-cache-exists' = '${{ steps.bootstrap.outputs.ccache-cache-exists }}' -eq 'true'
            'ccache-cache-used' = '${{ steps.bootstrap.outputs.ccache-cache-used }}' -eq 'true'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $entry | ConvertTo-Json -Depth 3 -AsArray | Out-File -FilePath dist/compile-success-meta.json -Encoding utf8

      - name: Link wheel
        if: success()
        shell: pwsh
        run: npx tsx scripts/cli.ts 09.wheel --pt-src $env:PT_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Verify Wheel and Publish Release
        if: success()
        uses: "./.github/actions/A99.verify-and-publish"
        with:
          build-meta: dist/compile-success-meta.json
